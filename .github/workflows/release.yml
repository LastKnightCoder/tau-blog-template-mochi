name: 发布团子铺模板

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 核对发布标签
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const {version}=JSON.parse(fs.readFileSync('package.json','utf8')); if(process.env.RELEASE_TAG !== 'v'+version) throw Error('标签与版本号不一致');"
      - name: 安装固定依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 行为测试
        run: pnpm test
      - name: 构建模板
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: tau-blog-mochi
          path: output/tau.blog-mochi-*.zip
          if-no-files-found: error
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern 'tau.blog-mochi-*.zip' --dir output --clobber
          else
            gh release create "$RELEASE_TAG" output/tau.blog-mochi-*.zip --verify-tag --title "团子铺 $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
      - name: 提交到 Tau 插件中心
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PORTAL_API: https://plugins-api.taunote.app
        run: |
          archive=$(ls output/tau.blog-mochi-*.zip)
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PORTAL_API" | jq -r .value)
          echo "::add-mask::$token"
          for attempt in 1 2 3; do
            status=$(curl -sS -o portal-response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" -H "Content-Type: application/zip" \
              --data-binary "@$archive" "$PORTAL_API/v1/ci/releases") || status=000
            if [ "$status" != "000" ] && [ "$status" -lt 500 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          cat portal-response.json; echo
          if [ "$status" = "404" ]; then
            echo "::warning::模板尚未在插件中心首次提交，请先在 https://plugins.taunote.app 网页提交一次以绑定仓库"
            exit 0
          fi
          test "$status" -ge 200 && test "$status" -lt 300
